name: Publish Pages Demo

# Publishes the fixture demo under reports/<run-id>/ and updates the site index.
# Real lockfile analysis on PRs/push also publishes via lockfile-analysis.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pages.yml
      - fixtures/sample-project/**
      - action.yml
      - dist/bundle/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lockfile-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout existing GitHub Pages site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-site
        continue-on-error: true

      - name: Initialize pages site directory
        run: mkdir -p gh-pages-site/reports

      - name: Resolve commit title
        id: commit-meta
        run: |
          {
            echo "title<<EOF"
            git log -1 --format=%s
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build fixture report
        id: demo
        uses: ./
        with:
          old-lockfile-path: fixtures/sample-project/before/package-lock.json
          new-lockfile-path: fixtures/sample-project/after/package-lock.json
          output-dir: report-output
          project-name: sample-project
          post-pr-comment: false
          skip-if-unchanged: false
          pages-base-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          report-commit: ${{ github.sha }}
          report-commit-title: ${{ steps.commit-meta.outputs.title }}

      - name: Merge report into GitHub Pages site
        run: |
          npx tsx scripts/prepare-pages-site.ts \
            --site-dir gh-pages-site \
            --report-file report-output/index.html \
            --meta-file report-output/report-meta.json \
            --pages-base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --repository-url "https://github.com/${{ github.repository }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-site

      - id: deployment
        uses: actions/deploy-pages@v4
