name: Publish Pages Demo

# Publishes the fixture demo under reports/<run-id>/ and updates the site index.
# Real lockfile analysis on PRs/push also publishes via lockfile-analysis.yml.

on:
  workflow_dispatch:
    inputs:
      chain-remaining:
        description: Internal — remaining chained demo publishes (do not set manually)
        required: false
        default: "0"
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pages.yml
      - fixtures/sample-project/**
      - scripts/prepare-pages-site.ts
      - src/report-manifest.ts
      - src/report-meta.ts
      - src/git/manifest.ts
      - action.yml
      - dist/bundle/**

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lockfile-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Checkout existing GitHub Pages site
        id: pages-site
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add gh-pages-site FETCH_HEAD
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            mkdir -p gh-pages-site/reports
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize pages site directory
        run: mkdir -p gh-pages-site/reports

      - name: Remove legacy fake demo entries
        run: rm -rf gh-pages-site/reports/sample-demo-*

      - name: Resolve commit title
        id: commit-meta
        run: |
          {
            echo "title<<EOF"
            git log -1 --format=%s
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build fixture report
        id: demo
        uses: ./
        with:
          old-lockfile-path: fixtures/sample-project/before/package-lock.json
          new-lockfile-path: fixtures/sample-project/after/package-lock.json
          output-dir: report-output
          project-name: sample-project
          post-pr-comment: false
          skip-if-unchanged: false
          fail-on-red: false
          pages-base-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          report-commit: ${{ github.sha }}
          report-base-commit: ${{ steps.commit-meta.outputs.base }}
          report-commit-title: ${{ steps.commit-meta.outputs.title }}

      - name: Merge report into GitHub Pages site
        id: merge
        run: |
          npx tsx scripts/prepare-pages-site.ts \
            --site-dir gh-pages-site \
            --report-file report-output/index.html \
            --meta-file report-output/report-meta.json \
            --pages-base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --repository-url "https://github.com/${{ github.repository }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages-site

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Chain demo history runs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MANIFEST="gh-pages-site/reports/manifest.json"
          COUNT=0
          if [ -f "$MANIFEST" ]; then
            COUNT=$(node -pe "JSON.parse(require('fs').readFileSync('$MANIFEST','utf8')).reports.length")
          fi
          TARGET=3
          NEED=$((TARGET - COUNT))
          CHAIN="${{ github.event.inputs.chain-remaining || '0' }}"

          echo "Reports on site: $COUNT (target $TARGET, need $NEED more)"

          if [ "$NEED" -le 0 ]; then
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            gh workflow run publish-pages.yml --ref "${GITHUB_REF_NAME}" -f "chain-remaining=$((NEED - 1))"
          elif [ "$CHAIN" != "0" ]; then
            gh workflow run publish-pages.yml --ref "${GITHUB_REF_NAME}" -f "chain-remaining=$((CHAIN - 1))"
          elif [ "$NEED" -gt 0 ]; then
            gh workflow run publish-pages.yml --ref "${GITHUB_REF_NAME}" -f "chain-remaining=$((NEED - 1))"
          fi
