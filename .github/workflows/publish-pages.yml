name: Publish Pages Demo

# This repo's GitHub Pages site always shows the fixture demo (lodash CVE + nested negotiator).
# Real lockfile analysis on PRs uploads artifacts via lockfile-analysis.yml instead.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pages.yml
      - fixtures/sample-project/**
      - action.yml
      - dist/bundle/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lockfile-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build fixture report
        uses: ./
        with:
          old-lockfile-path: fixtures/sample-project/before/package-lock.json
          new-lockfile-path: fixtures/sample-project/after/package-lock.json
          output-dir: report-output
          project-name: sample-project
          post-pr-comment: false
          skip-if-unchanged: false

      - uses: actions/upload-pages-artifact@v3
        with:
          path: report-output

      - id: deployment
        uses: actions/deploy-pages@v4
