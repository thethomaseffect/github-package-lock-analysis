name: Lockfile Analysis

on:
  pull_request:
    paths:
      - package-lock.json
  push:
    branches: [main]
    paths:
      - package-lock.json
  workflow_dispatch:
    inputs:
      use-fixtures:
        description: Run against sample fixture lockfiles instead of the repo lockfile
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze root lockfile (git diff)
        if: ${{ !inputs.use-fixtures }}
        id: analysis
        uses: ./
        with:
          lockfile-path: package-lock.json
          output-dir: report-output
          post-pr-comment: ${{ github.event_name == 'pull_request' }}
          skip-if-unchanged: true

      - name: Analyze fixture lockfiles (demo)
        if: ${{ inputs.use-fixtures }}
        id: analysis-fixtures
        uses: ./
        with:
          old-lockfile-path: fixtures/sample-project/before/package-lock.json
          new-lockfile-path: fixtures/sample-project/after/package-lock.json
          output-dir: report-output
          project-name: sample-project
          post-pr-comment: false
          skip-if-unchanged: false

      - uses: actions/upload-artifact@v4
        if: steps.analysis.outputs.report-path != '' || steps.analysis-fixtures.outputs.report-path != ''
        with:
          name: lockfile-report
          path: report-output/index.html
