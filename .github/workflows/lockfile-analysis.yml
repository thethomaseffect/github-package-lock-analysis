name: Lockfile Analysis

on:
  pull_request:
    paths:
      - package-lock.json
  push:
    branches: [main]
    paths:
      - package-lock.json
  workflow_dispatch:
    inputs:
      audit-existing:
        description: Scan the current HEAD lockfile for existing CVEs (manual only; no diff)
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: lockfile-pages
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync existing GitHub Pages site from live URL
        run: |
          mkdir -p gh-pages-site/reports
          npx tsx scripts/sync-pages-site-from-live.ts \
            --site-dir gh-pages-site \
            --pages-base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Resolve report commit
        id: report-commit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "title<<EOF"
            git log -1 --format=%s "${SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./
        id: analysis
        with:
          lockfile-path: package-lock.json
          output-dir: report-output
          post-pr-comment: ${{ github.event_name == 'pull_request' }}
          skip-if-unchanged: ${{ github.event_name != 'workflow_dispatch' }}
          audit-existing: ${{ github.event_name == 'workflow_dispatch' && inputs.audit-existing }}
          fail-on-red: true
          report-manifest-path: gh-pages-site/reports/manifest.json
          use-report-manifest-base: true
          pages-base-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          report-commit: ${{ steps.report-commit.outputs.sha }}
          report-commit-title: ${{ steps.report-commit.outputs.title }}

      - uses: actions/upload-artifact@v6
        if: steps.analysis.outputs.report-path != ''
        with:
          name: lockfile-report
          path: report-output/index.html

      - name: Merge report into GitHub Pages site
        if: steps.analysis.outputs.report-path != ''
        run: |
          npx tsx scripts/prepare-pages-site.ts \
            --site-dir gh-pages-site \
            --report-file report-output/index.html \
            --meta-file report-output/report-meta.json \
            --pages-base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --repository-url "https://github.com/${{ github.repository }}"

      - uses: actions/upload-pages-artifact@v5
        if: steps.analysis.outputs.report-path != ''
        with:
          path: gh-pages-site

      - id: deployment
        if: steps.analysis.outputs.report-path != ''
        uses: actions/deploy-pages@v5
