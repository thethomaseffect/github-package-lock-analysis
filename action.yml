name: Package Lock Analysis
description: Diff package-lock.json changes, check CVEs, and publish a nested dependency security report
author: github-package-lock-analysis

inputs:
  lockfile-path:
    description: Relative path to package-lock.json in the repository
    required: false
    default: package-lock.json
  old-lockfile-path:
    description: Path to the base/previous package-lock.json (optional — auto-resolved from git on PR/push)
    required: false
    default: ""
  new-lockfile-path:
    description: Path to the updated package-lock.json (optional — defaults to workspace lockfile-path)
    required: false
    default: ""
  base-ref:
    description: Git ref for the base lockfile when auto-resolving (defaults to PR base or previous push commit)
    required: false
    default: ""
  head-ref:
    description: Git ref for the head lockfile when auto-resolving (defaults to PR head or current SHA)
    required: false
    default: ""
  output-dir:
    description: Directory where the static HTML report is written
    required: false
    default: report-output
  include-hackernews:
    description: Whether to include optional Hacker News enrichment
    required: false
    default: "false"
  project-name:
    description: Display name for the project root in breadcrumb paths
    required: false
    default: ""
  skip-if-unchanged:
    description: Skip analysis when git reports no diff for lockfile-path between base and head
    required: false
    default: "true"
  post-pr-comment:
    description: Post or update a summary comment on pull requests (requires pull_request event and GITHUB_TOKEN)
    required: false
    default: "true"
  artifact-name:
    description: Artifact name referenced in PR comments for the HTML report
    required: false
    default: lockfile-report
  report-url:
    description: Optional public URL to the HTML report (e.g. GitHub Pages) included in PR comments
    required: false
    default: ""
  report-manifest-path:
    description: Path to reports/manifest.json from a checked-out gh-pages site (enables manifest-based diff base)
    required: false
    default: ""
  use-report-manifest-base:
    description: Compare HEAD against the latest commit in report-manifest-path instead of push before or PR base
    required: false
    default: "false"
  pages-base-url:
    description: GitHub Pages base URL used to build report-url output (e.g. https://owner.github.io/repo)
    required: false
    default: ""
  report-commit:
    description: Commit SHA analyzed for this report (defaults to head-ref or GITHUB_SHA)
    required: false
    default: ""
  report-base-commit:
    description: Base commit SHA diffed against (auto-resolved from git when omitted)
    required: false
    default: ""
  report-run-id:
    description: Workflow run ID used in report-url paths (defaults to GITHUB_RUN_ID)
    required: false
    default: ""
  report-commit-title:
    description: Commit message title shown on the reports index page
    required: false
    default: ""
  audit-existing:
    description: Manual workflow_dispatch only — scan the current HEAD lockfile for known CVEs (no diff)
    required: false
    default: "false"
  fail-on-red:
    description: Fail the action when known CVEs are found in changes or existing vulnerability audit
    required: false
    default: "true"
  enrichment-limit:
    description: Max changed packages to enrich with CVE/changelog lookups; above this, rows are manual-review only (npm link)
    required: false
    default: "500"
  enrichment-concurrency:
    description: Concurrent enrichment requests when under enrichment-limit
    required: false
    default: "8"
  summary-list-limit:
    description: Max changed packages listed in job summary and PR comments
    required: false
    default: "100"

outputs:
  report-path:
    description: Path to the generated index.html report (empty when skipped)
  report-url:
    description: Public URL to this report when pages-base-url or report-url is configured
  report-commit:
    description: Commit SHA associated with this report
  report-run-id:
    description: Workflow run ID associated with this report
  changed-count:
    description: Number of packages with version changes
  red-count:
    description: Number of changed packages flagged with known CVEs
  yellow-count:
    description: Number of packages changed without confirmed CVEs
  existing-red-count:
    description: Number of unchanged installed packages flagged with known CVEs during audit-existing

runs:
  using: node24
  main: dist/bundle/index.js

branding:
  icon: shield
  color: yellow
